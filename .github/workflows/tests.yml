# Corre la suite de tests y el lint en cada push y pull request sobre main.
#
# El paso de lint estuvo ausente a proposito hasta la Semana 2: el repositorio
# no pasaba `pre-commit run --all-files` y un badge rojo desde el primer commit
# es peor que no tener badge. La condicion para agregarlo era justamente que
# pasara limpio, y ya pasa, asi que aqui esta.
#
# Va como job aparte y no como paso del job de tests por dos motivos: el
# formato no depende de la version de Python, asi que correrlo en la matriz lo
# ejecutaria dos veces para nada; y si el codigo esta mal formateado pero los
# tests pasan, interesa ver las dos cosas por separado.
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          # Una sola version: black, ruff e isort dan el mismo resultado en
          # 3.10 y 3.13, y las versiones de las herramientas las fija
          # .pre-commit-config.yaml, no el interprete.
          python-version: "3.13"

      - name: Correr pre-commit
        # Los mismos hooks que corren en local (black, ruff, isort,
        # nbstripout), con las mismas versiones fijadas en el config. El hook
        # de nbstripout es el que garantiza que no entren salidas de notebook
        # al repositorio: las figuras que son evidencia van a outputs/figures/.
        uses: pre-commit/action@v3.0.1

  pytest:
    runs-on: ubuntu-latest

    strategy:
      # Sin fail-fast: si una version falla, interesa ver si la otra tambien.
      fail-fast: false
      matrix:
        # Los dos extremos soportados: pyproject declara requires-python
        # ">=3.10" y el entorno de desarrollo local corre 3.13.
        python-version: ["3.10", "3.13"]

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar el paquete y las dependencias de desarrollo
        # rasterio y geopandas publican wheels en PyPI para Linux, asi que no
        # hace falta conda ni compilar GDAL.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Correr los tests
        # tests/test_scene_builder.py se omite: necesita la escena Sentinel-2
        # en data/raw/, que no se versiona. Su skipif ya lo resuelve.
        run: pytest -q
