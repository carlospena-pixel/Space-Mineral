[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mineralmap"
version = "0.1.0"
description = "Deteccion de minerales de alteracion hidrotermal a partir de imagenes Sentinel-2 L2A"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Camila" },
    { name = "Carlos" },
]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "rasterio",
    "geopandas",
    "scikit-learn",
    "pyyaml",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
    "isort",
    "pre-commit",
    "nbstripout",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.isort]
profile = "black"
src_paths = ["src"]

[tool.pytest.ini_options]
# Los tests viven en tests/. Se acota la recoleccion a esa carpeta para no
# arrastrar prototipos sueltos en scripts/ (p. ej. scripts/test_masking.py, que
# colisionaria por basename con tests/test_masking.py). pythonpath = ["src"]
# permite `pytest -q` sin exportar PYTHONPATH ni instalar el paquete.
testpaths = ["tests"]
pythonpath = ["src"]
