#
#     16.79   1.05%     6  Depositos antropicos, botaderos de mina
#     [AMB-EXPLICITO] La mina Cerro Colorado. NO cae en ambiguo por omision:
#     se decide. Las dos lecturas son reales y se anulan --- el esteril de
#     un porfido ES roca alterada, molida y expuesta (a favor de positivo),
#     pero un botadero no es una zona de alteracion cartografiada sino una
#     obra humana, y su ubicacion no es la de la roca original (a favor de
#     negativo). Ademas hay circularidad: la mina esta ahi PORQUE hay
#     alteracion, asi que declararlo positivo casi garantiza acierto en el
#     punto mas llamativo del mapa e inflaria el resultado sin sustento
#     geologico. Como ambiguo se excluye del calculo y Carlos puede medir
#     con y sin el. Ocupa 16,79 km2 = 1,05 % del AOI.
