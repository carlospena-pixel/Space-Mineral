#     [AMB] Facies PLUTONICA gruesa del Complejo Yabricoya, no el sistema
#     porfidico. Es la decision mas discutible de la lista: son 81,65 km2
#     (5,10 %) y meterlos al positivo por pertenecer al Yabricoya
