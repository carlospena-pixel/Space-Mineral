# Verdad de terreno para el AOI del distrito Cerro Colorado (T19KDT).
#
# Fuente: cartas SERNAGEOMIN Pozo Almonte (M204) y Mamina (M303), digitalizadas
# en el FeatureServer Chile_Geology. Se descargan con
# `python scripts/descargar_geologia.py`. Ver data/external/geologia/README.md.
#
# ADVERTENCIA: esta asignacion es un juicio geologico explicito, no un dato del
# mapa original. Las cartas no cartografian "alteracion" como atributo:
# SERNAGEOMIN publica un unico tema ("Geologia Basica") y no publica poligonos
# de alteracion hidrotermal para el norte de Chile. El positivo de esta capa es
# una seleccion de unidades litologicas hecha por el equipo, y este archivo es
# donde hay que discutirla.
#
# LAS LISTAS SON UNA PROPUESTA, marcada unidad por unidad en la tabla del final
# con [POS] / [NEG] / [AMB]. Estan para revisarse y corregirse, no para creerse.
#
# ---------------------------------------------------------------------------
# CRITERIO
# ---------------------------------------------------------------------------
# POSITIVO  Alteracion hidrotermal declarada, o intrusivos porfidicos felsicos
#           del distrito (daciticos, riodaciticos, rioliticos).
#           8 unidades, 20,30 km2 = 1,27 % del AOI.
# NEGATIVO  Lo que con seguridad no aloja alteracion argilica in situ:
#           depositos eolicos, aluviales activos, coluviales, deslizamientos y
#           cobertura agricola. 10 unidades, 76,94 km2 = 4,81 % del AOI.
# AMBIGUO   Todo lo demas: 27 unidades, 1.502,76 km2 = 93,92 %. Ante la duda,
#           ambiguo --- un positivo mal declarado envenena las metricas y no
#           deja rastro.
#
# Las dos decisiones que hay que poder defender:
#   1. Los botaderos de la mina Cerro Colorado (16,79 km2) quedan AMBIGUO, y de
#      forma explicita, no por omision. El argumento completo esta en su linea
#      de la tabla del final.
#   2. Las facies plutonicas del Complejo Yabricoya (81,65 km2) NO son positivo
#      pese a pertenecer al complejo: son roca de caja, no el sistema
#      porfidico. Incluirlas multiplicaria el positivo por cinco sin sustento.
# ---------------------------------------------------------------------------

fuente:
  pozo_almonte: data/external/geologia/pozo_almonte.geojson
  mamina: data/external/geologia/mamina.geojson
  campo_unidad: Unidad_geologica

clases:
  positivo: 1
  negativo: 0
  ambiguo: 255

unidades:
  positivo:
    - Brechas hidrotermales de turmalina del Complejo Yabricoya
    - Complejo intrusivo Cerro Colorado, brechas intrusivas
    - Complejo intrusivo Cerro Colorado, monzodiorita cuarcifera
    - Porfidos hipabisales dacíticos del Complejo Yabricoya
    - Porfidos tonaliticos-granodioriticos La Planada del Complejo Yabricoya
    - Porfido daciticos del Cretacico Superior
    - Porfido daciticos y riodaciticos del Cretacico Superior alto-Paleoceno Inferior
    - Porfidos y domos intrusivos rioliticos del Cretácico Superior
  negativo:
    - Depositos aluviales activos
    - Depositos coluviales del Pleistoceno-Holoceno
    - Depositos eolicos activos en dunas crecientes
    - Depositos eolicos activos en dunas longitudinales
    - Depositos eolicos activos, indiferenciados
    - Depositos eolicos activos en dunas estelares
    - Depositos de piedemonte, depositos eolicos medios
    - Depositos antropicos, suelos de uso agrícola
    - Depositos de deslizamiento del Pleistoceno-Holoceno
    - Depositos aluviales antiguos, facies de humedales

