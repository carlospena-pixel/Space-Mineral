# 38 unidades, generadas recortando la union de ambas hojas al bbox del AOI
# (E 419.960-459.960 / N 7.740.040-7.780.040, EPSG:32719).
#
# Columnas: km2 dentro del AOI | % del AOI | hoja(s) | unidad
#
# La marca [P] es una PROPUESTA MIA de clasificacion, no una decision tomada.
#   [P-neg] propongo negativo    [P-amb] propongo dejar ambiguo
# No hay ningun [P-pos]: ver la advertencia de arriba.
#
# Para usar una unidad hay que copiar su nombre EXACTO a la lista de arriba,
# con acentos. La comparacion recorta espacios de los extremos (`.strip()`)
# porque la fuente trae "Granitos, monzonitas cuarcíferas y sienogranitos del
# Cretácico Superior" con y sin espacio final, como dos etiquetas distintas.
#
#   818.22  51.14%  ambas  Depositos aluviales antiguos del Pleistoceno-Holoceno
#     [P-amb] Es la mitad del AOI. Relleno aluvial antiguo: puede acarrear
#     material retrabajado desde fuentes alteradas de la cordillera, asi que
#     declararlo negativo en bloque asumiria algo que la carta no dice.
#     Dejarlo ambiguo cuesta la mitad del AOI en las metricas; es el costo de
#     no afirmar de mas. Es la decision mas discutible de esta lista.
#
#   359.04  22.44%  ambas  Depositos aluviales activos
