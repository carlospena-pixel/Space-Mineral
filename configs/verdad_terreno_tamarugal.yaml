# Verdad de terreno para el AOI de Tamarugal (T19KDT).
#
# Fuente: cartas SERNAGEOMIN Pozo Almonte (M204) y Mamina (M303), digitalizadas
# en el FeatureServer Chile_Geology. Se descargan con
# `python scripts/descargar_geologia.py`. Ver data/external/geologia/README.md.
#
# ADVERTENCIA: esta asignacion es un juicio geologico explicito, no un dato del
# mapa original. Las cartas no cartografian "alteracion" como atributo:
# SERNAGEOMIN publica un unico tema ("Geologia Basica") y no publica poligonos
# de alteracion hidrotermal para el norte de Chile. El positivo de esta capa es
# una seleccion de unidades litologicas hecha por el equipo, y este archivo es
# donde hay que discutirla.
#
# ---------------------------------------------------------------------------
# LEER ANTES DE LLENAR `unidades.positivo`
# ---------------------------------------------------------------------------
# La union de ambas hojas cubre el AOI al 100 % (1600,0 de 1600 km2), pero
# dentro del AOI NO hay ninguna unidad candidata a alteracion argilica. Las
# tres que se esperaban existen en la hoja Mamina y caen todas FUERA:
#
#   Brechas hidrotermales de turmalina (Cpx. Yabricoya)  29,5 km al E del borde
#   Complejo intrusivo Cerro Colorado                    10,3 km al E del borde
#   Complejo Yabricoya (todas sus facies)                19,1 km al E del borde
#
# El AOI cae integramente sobre el relleno sedimentario de la Pampa del
# Tamarugal: un 96 % es deposito aluvial, salino, eolico o de piedemonte. Es
# una cuenca de relleno, no el distrito de porfido. Por eso `positivo` queda
# VACIO: no hay ninguna unidad de esta cartografia, dentro de este AOI, que se
# pueda declarar positivo sin inventarlo.
#
# Con `positivo` vacio la capa es utilizable igual, y no es un consuelo: un
# negativo bien fundado sobre el 96 % del AOI mide la tasa de falsos positivos
# del detector, que es la pregunta que el mapa de angulos no puede responder
# solo. Lo que no se puede estimar con esta capa es el recall.
#
# Si se necesita medir deteccion positiva, hay que mover o ampliar el AOI hacia
# el este --- unos 10-30 km --- para que entren Cerro Colorado y Yabricoya. Esa
# es una decision de alcance del proyecto, no de este archivo.
# ---------------------------------------------------------------------------

fuente:
  pozo_almonte: data/external/geologia/pozo_almonte.geojson
  mamina: data/external/geologia/mamina.geojson
  campo_unidad: Unidad_geologica

clases:
  positivo: 1
  negativo: 0
  ambiguo: 255

unidades:
  # Vacias a proposito: las llena una persona, no el codigo. Todo lo que no
  # aparezca en ninguna de las dos listas cae en `ambiguo` (255) y se excluye
  # del calculo de metricas. El pipeline corre con ambas vacias --- el
  # resultado es 100 % ambiguo --- y esa corrida sirve para verificar que la
  # rasterizacion y el alineamiento estan bien antes de discutir geologia.
  positivo: []
  negativo: []

# ===========================================================================
# UNIDADES PRESENTES EN EL AOI, por superficie descendente
